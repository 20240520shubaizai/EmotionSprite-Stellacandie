[project]
name = "emotion-sprite-agent-core"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "PyMySQL==1.1.2",
  "langgraph==1.2.11",
  "fastembed==0.8.0",
  "sqlite-vec==0.1.9",
  "mcp==1.13.1",
  "starlette==0.47.3",
  "sse-starlette==2.4.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
